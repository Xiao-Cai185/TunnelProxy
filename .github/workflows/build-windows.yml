name: Build Windows Client

on:
  push:
    branches: [ main ]
    paths:
      - 'windows-client/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'windows-client/**'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Download WinDivert SDK
      shell: powershell
      run: |
        Write-Host "Downloading WinDivert SDK..."
        $url = "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip"
        $output = "WinDivert-2.2.2-A.zip"
        Invoke-WebRequest -Uri $url -OutFile $output

        Write-Host "Extracting WinDivert SDK..."
        Expand-Archive -Path $output -DestinationPath "windows-client/core/third_party/WinDivert" -Force

        # 移动文件到正确位置
        Move-Item -Path "windows-client/core/third_party/WinDivert/WinDivert-2.2.2-A/*" -Destination "windows-client/core/third_party/WinDivert/" -Force
        Remove-Item -Path "windows-client/core/third_party/WinDivert/WinDivert-2.2.2-A" -Recurse -Force

        Write-Host "WinDivert SDK ready"

    - name: Build Core Engine (C DLL)
      shell: powershell
      run: |
        Write-Host "Building Core Engine..."
        cd windows-client/core

        # 创建构建目录
        if (Test-Path build) { Remove-Item -Path build -Recurse -Force }
        New-Item -ItemType Directory -Path build | Out-Null
        cd build

        # 配置 CMake
        cmake .. -G "Visual Studio 17 2022" -A x64
        if ($LASTEXITCODE -ne 0) {
          Write-Error "CMake configuration failed"
          exit 1
        }

        # 编译
        cmake --build . --config Release
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Core engine build failed"
          exit 1
        }

        Write-Host "Core engine built successfully"

    - name: Build GUI Application
      shell: powershell
      run: |
        Write-Host "Building GUI Application..."
        cd windows-client/gui

        # 还原依赖
        dotnet restore
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Dependency restore failed"
          exit 1
        }

        # 编译并发布
        dotnet publish -c Release -r win-x64 --self-contained -o publish
        if ($LASTEXITCODE -ne 0) {
          Write-Error "GUI build failed"
          exit 1
        }

        Write-Host "GUI application built successfully"

    - name: Package Release
      shell: powershell
      run: |
        Write-Host "Packaging release..."

        # 创建发布目录
        $publishDir = "windows-client/publish/TunnelProxy-Windows-x64"
        if (Test-Path $publishDir) { Remove-Item -Path $publishDir -Recurse -Force }
        New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

        # 复制 GUI 文件
        Copy-Item -Path "windows-client/gui/publish/*" -Destination $publishDir -Recurse -Force

        # 查找并复制核心引擎 DLL（支持多种可能的路径）
        $dllPaths = @(
            "windows-client/core/build/Release/tunnelproxy.dll",
            "windows-client/core/build/lib/Release/tunnelproxy.dll",
            "windows-client/core/build/bin/Release/tunnelproxy.dll"
        )

        $dllFound = $false
        foreach ($path in $dllPaths) {
            if (Test-Path $path) {
                Write-Host "Found tunnelproxy.dll at: $path"
                Copy-Item -Path $path -Destination $publishDir -Force

                # 从同一目录复制 WinDivert 文件
                $dllDir = Split-Path $path -Parent
                Copy-Item -Path "$dllDir/WinDivert.dll" -Destination $publishDir -Force
                Copy-Item -Path "$dllDir/WinDivert64.sys" -Destination $publishDir -Force

                $dllFound = $true
                break
            }
        }

        if (-not $dllFound) {
            Write-Error "tunnelproxy.dll not found in any expected location"
            exit 1
        }

        # 复制 README 文件
        Copy-Item -Path "windows-client/README.txt" -Destination $publishDir -Force

        # 打包 ZIP
        Compress-Archive -Path "$publishDir/*" -DestinationPath "windows-client/publish/TunnelProxy-Windows-x64.zip" -Force

        Write-Host "Package created successfully"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TunnelProxy-Windows-x64
        path: windows-client/publish/TunnelProxy-Windows-x64.zip
        retention-days: 90

    - name: Upload to Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: windows-client/publish/TunnelProxy-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Display Build Info
      shell: powershell
      run: |
        Write-Host "========================================" -ForegroundColor Green
        Write-Host "Build completed successfully!" -ForegroundColor Green
        Write-Host "========================================" -ForegroundColor Green
        Write-Host ""
        Write-Host "Artifact: TunnelProxy-Windows-x64.zip"
        Write-Host "Location: windows-client/publish/"
        Write-Host ""
        $size = (Get-Item "windows-client/publish/TunnelProxy-Windows-x64.zip").Length / 1MB
        Write-Host "Package size: $([math]::Round($size, 2)) MB"
        Write-Host ""
        Write-Host "Download from: Actions -> Artifacts"
